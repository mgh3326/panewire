version: 1
enabled: true
required_checks:
  - 'test (ubuntu-latest)'
# The required check runs on pull requests only; main is watched through
# the ci-ok aggregate, which runs on both.
watch_checks: ['ci-ok']
# The any-ref CI watch dispatches to bisect a red main (policy/fleet-ci-main-cancel).
any_ref_workflow: ci-any-ref.yml
blocking:
  - paths: ['session_reap.go', 'hub_session_reap.go', 'job.go', 'job_close.go', '*prune*.go', 'internal/fleet/job_dir_ttl.go']
    reason: Session reaping can destroy live session state before a revert.
  - paths: ['deploy/**', 'provision/**']
    reason: Service installation and database provisioning or teardown change persistent systems before a revert.
  - paths: ['hub.go', 'hub_*auth*.go', 'hub_*access*.go', 'hub_operator*.go', 'hub_security*.go', 'hub_cf_access.go', 'hub_client.go', 'hub_operator_client.go', 'hub_jobs_client.go', 'hub_handoffkeep.go', 'hub_quota_v2.go', 'lanes_write.go', 'stage2/adapters/supabase/**']
    reason: Hub and operator authentication changes can disclose tokens or admit writes immediately.
  - paths: ['.github/workflows/**']
    reason: Workflow changes can execute privileged automation before a revert.
  - paths: ['.mergewake/**']
    reason: Policy changes can authorize irreversible automation before a revert.
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50

deploy_approval:
  - paths: ['deploy/**', 'provision/**', 'hub_*auth*.go', 'hub_*access*.go', 'hub_security*.go', 'hub_operator*.go', 'session_reap.go', 'hub_session_reap.go', 'job_close.go']
    reason: Service access authority or destructive session lifecycle changes
