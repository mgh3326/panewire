name: Release

# A v* tag builds the four CGO-disabled node binaries stamped with the tag
# (`panewire version` prints it) and attaches them, with SHA256SUMS, to the
# tag's GitHub Release. A test tag v0.0.0* (e.g. v0.0.0-test.1) runs the
# same build and checks on the tag but is never published.
# Pull requests and manual runs build the same assets for
# a dry-run tag (v0.0.0-dryrun.<run>) and check them without publishing.
# Hosts pull published assets themselves (the fleet updater, or
# docs/runbooks/node-update.md); publishing to nodes stays a separate,
# operator-run `panewire update publish`. This workflow never reaches a host.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets for the selected tag
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested publication ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTAG'
          import os, re
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', os.environ['REF_NAME']):
              raise SystemExit('publication requires a vMAJOR.MINOR.PATCH tag')
          PYTAG
      # Pinned to reviewed commits: the publish job releases what this job
      # builds, so a moved tag must not change it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Resolve release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          else
            tag=v0.0.0-dryrun.$RUN_NUMBER
          fi
          # The tag is a path segment of the release URL the hub pins.
          case "$tag" in
            "" | . | .. | *[!A-Za-z0-9._-]*) echo "tag '$tag' is not a valid release path segment" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build assets
        run: |
          version=$(sh scripts/build-release.sh dist/release "$RELEASE_TAG")
          test "$version" = "$RELEASE_TAG"
      - name: Verify assets, SHA256SUMS and version output
        run: |
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            test -x "dist/release/panewire_${RELEASE_TAG}_${target}"
          done
          test "$("dist/release/panewire_${RELEASE_TAG}_linux_amd64" version)" = "$RELEASE_TAG"
          (cd dist/release && sha256sum -c SHA256SUMS)
          test "$(wc -l < dist/release/SHA256SUMS)" -eq 4
          cat dist/release/SHA256SUMS
      - name: Keep assets for publish
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  test:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...

  publish:
    needs: [build, test]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/release
      # The checkouts above use github.sha; refuse if the tag was moved since.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $TAG now points at $tagged, but the assets were built from $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A -suffix tag (v1.2.3-rc.1) is a pre-release: never "Latest", so
        # hosts that follow the latest release do not pick it up.
        run: |
          set --
          case "$TAG" in *-*) set -- --prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sh scripts/repair-release-assets.sh "$GITHUB_REF_NAME" dist/release
            exit 0
          fi
          gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "$@" \
            --notes "panewire $TAG — publish with: panewire update publish --version $TAG --url ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/panewire_${TAG}_<os>_<arch> --sha256 <from SHA256SUMS> --machines <canary>"
