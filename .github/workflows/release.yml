name: Release

# A v* tag builds the four CGO-disabled node binaries stamped with the tag
# (`panewire version` prints it) and attaches them, with SHA256SUMS, to the
# tag's GitHub Release. A test tag v0.0.0* (e.g. v0.0.0-test.1) runs the
# same build and checks on the tag but is never published.
# Main pushes and manual runs build dry-run assets without publishing.
# Pull requests run a fast Go build.
# Hosts pull published assets themselves (the fleet updater, or
# docs/runbooks/node-update.md); publishing to nodes stays a separate,
# operator-run `panewire update publish`. This workflow never reaches a host.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets for the selected tag
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  # The gate below reads the main-stage verdict on the release commit.
  checks: read
  statuses: read

jobs:
  gate:
    # A release never builds or publishes before the main stage is green on
    # this commit: `ci-ok` today, `deploy-ok` once §4-3 switches the gate (set
    # the PANEWIRE_RELEASE_GATE_CONTEXT repository variable; the default is
    # `ci-ok`). Pull requests keep their fast build: they have no main stage.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the main-stage gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CONTEXT: ${{ vars.PANEWIRE_RELEASE_GATE_CONTEXT || 'ci-ok' }}
        shell: bash
        run: |
          deadline=$((SECONDS + 3600))
          while :; do
            check=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${CONTEXT}" \
              --jq '[.check_runs[]][0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$check" in
              "completed success") echo "release gate: ${CONTEXT} check run success on ${SHA}"; exit 0 ;;
              "completed "*) echo "release gate: ${CONTEXT} check run ${check} on ${SHA}" >&2; exit 1 ;;
            esac
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
              --jq '[.statuses[] | select(.context == env.CONTEXT)][0].state // ""' 2>/dev/null || true)
            case "$state" in
              success) echo "release gate: ${CONTEXT} commit status success on ${SHA}"; exit 0 ;;
              failure|error) echo "release gate: ${CONTEXT} commit status ${state} on ${SHA}" >&2; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "release gate: ${CONTEXT} did not turn green on ${SHA} within 60m" >&2
              exit 1
            fi
            sleep 30
          done

  build:
    needs: [gate]
    # The gate is skipped for pull requests; every other event must pass it.
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested publication ref
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTAG'
          import os, re
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?', os.environ['REF_NAME']):
              raise SystemExit('publication requires a vMAJOR.MINOR.PATCH tag')
          PYTAG
      # Pinned to reviewed commits: the publish job releases what this job
      # builds, so a moved tag must not change it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          # Full history and tags: components.json diffs against the previous release tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cached
      - name: Fast PR build
        if: github.event_name == 'pull_request'
        run: go build ./...
      - name: Resolve release tag
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          else
            tag=v0.0.0-dryrun.$RUN_NUMBER
          fi
          # The tag is a path segment of the release URL the hub pins.
          case "$tag" in
            "" | . | .. | *[!A-Za-z0-9._-]*) echo "tag '$tag' is not a valid release path segment" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build assets
        if: github.event_name != 'pull_request'
        run: |
          version=$(sh scripts/build-release.sh dist/release "$RELEASE_TAG")
          test "$version" = "$RELEASE_TAG"
      # Names the daemon components this release changed (docs/release-components.md).
      # The previous release is the published, non-prerelease release that sorts
      # just before this tag (a rerun excludes this tag itself); with none, or when
      # git cannot diff, every component is listed (the conservative default).
      - name: Name the components this release changed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$({ gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' | grep -v -e '^v0\.0\.0' -e "^${RELEASE_TAG}\$" || true; echo "$RELEASE_TAG"; } | sort -V | grep -B1 -x "$RELEASE_TAG" | head -n 1 | grep -v -x "$RELEASE_TAG" || true)
          if [ -n "$prev" ] && git diff --no-renames --name-only "$prev" "$GITHUB_SHA" > "$RUNNER_TEMP/changed"; then
            go run ./cmd/release-components -version "$RELEASE_TAG" -previous "$prev" < "$RUNNER_TEMP/changed" > dist/release/components.json
          else
            go run ./cmd/release-components -version "$RELEASE_TAG" -unknown < /dev/null > dist/release/components.json
          fi
          (cd dist/release && sha256sum components.json >> SHA256SUMS)
          cat dist/release/components.json
      - name: Verify assets, SHA256SUMS and version output
        if: github.event_name != 'pull_request'
        run: |
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            test -x "dist/release/panewire_${RELEASE_TAG}_${target}"
          done
          test -s dist/release/components.json
          test "$("dist/release/panewire_${RELEASE_TAG}_linux_amd64" version)" = "$RELEASE_TAG"
          (cd dist/release && sha256sum -c SHA256SUMS)
          test "$(wc -l < dist/release/SHA256SUMS)" -eq 5
          cat dist/release/SHA256SUMS
      - name: Keep assets for publish
        if: ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [gate]
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cached
      - run: go vet ./...
      - run: go test ./...

  publish:
    needs: [gate, build, test]
    if: ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/release
      # The checkouts above use github.sha; refuse if the tag was moved since.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $TAG now points at $tagged, but the assets were built from $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A -suffix tag (v1.2.3-rc.1) is a pre-release: never "Latest", so
        # hosts that follow the latest release do not pick it up.
        run: |
          set --
          case "$TAG" in *-*) set -- --prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sh scripts/repair-release-assets.sh "$GITHUB_REF_NAME" dist/release
            exit 0
          fi
          summary=$(jq -r '.summary' dist/release/components.json)
          gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "$@" \
            --notes "panewire $TAG — $summary. publish with: panewire update publish --version $TAG --url ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG/panewire_${TAG}_<os>_<arch> --sha256 <from SHA256SUMS> --machines <canary>"
