name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: sh -n deploy/alloy/install-linux.sh deploy/alloy/run-alloy.sh
      - run: brew install gitleaks && gitleaks git --no-banner --config .gitleaks.toml
