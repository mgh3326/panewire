name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: sh -n deploy/alloy/install-linux.sh
      - name: Install gitleaks
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml
