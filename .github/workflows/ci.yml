name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, test)
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  test:
    # The process-group kill and reaping behaviour the R19 quota path depends on
    # differs between Darwin and Linux, so both are exercised.
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The full -race suite stays red on a pre-existing hk 1243 bytes.Buffer
      # race in the r20t5 10ms-timer tests, so the unconfirmed-replay races
      # (#1002/#1034) get their own -race pin on both OSes.
      - run: go test -race -count=3 -run 'T1002|T1034' .
      - run: go test -race -run '^TestQuiet' .
      - run: sh -n deploy/alloy/install-linux.sh deploy/alloy/run-alloy.sh
      # gitleaks is installed through Homebrew, which only the macOS runner has.
      - if: runner.os == 'macOS'
        run: brew install gitleaks && gitleaks git --no-banner --config .gitleaks.toml

  postgres:
    # The hub inbox's Postgres backend (docs/hub-postgres.md). Service
    # containers exist only on Linux runners, and hosts never run a database
    # for tests, so this is the only place the Postgres half of the store
    # contract runs. Trust auth keeps a password out of this public file.
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: panewire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: store contract and migrate-sqlite on Postgres
        env:
          PANEWIRE_TEST_HUB_DATABASE_URL: postgres://postgres@localhost:5432/panewire?sslmode=disable
        shell: bash
        # A skip here would mean the Postgres half silently did not run.
        run: |
          set -o pipefail  # shell: bash already sets it; kept explicit for the tee
          go test -race -count=2 -v -run 'LaneInboxStore|HubServerOpensPostgresInbox|HubMigrateSQLite|HubDatabaseURL' . 2>&1 | tee "$RUNNER_TEMP/postgres-test.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-test.log"; then
            echo "a Postgres test skipped"; exit 1
          fi

  ci-ok:
    # Aggregate gate check: PR CI reports a check run named ci-ok. On
    # dispatches, a partial suite must not mint an exact 'ci-ok' check run.
    name: ${{ (inputs.suite || 'all') == 'all' && 'ci-ok' || format('ci-ok ({0})', inputs.suite) }}
    runs-on: ubuntu-latest
    needs: [test, postgres]
    if: always()
    steps:
      - name: Check required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          if [ "$TEST_RESULT" != success ]; then
            echo "test job did not succeed: $TEST_RESULT"
            exit 1
          fi
          if [ "$POSTGRES_RESULT" != success ]; then
            echo "postgres job did not succeed: $POSTGRES_RESULT"
            exit 1
          fi
