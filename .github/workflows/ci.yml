name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, test, postgres)
        required: false
        default: all
        type: string
    outputs:
      ok:
        # 'true' when the ci-ok gate passed. ci-any-ref posts its status from
        # this, not from the whole run, so the advisory test-macos job cannot
        # fail or cancel a dispatch.
        value: ${{ jobs.ci-ok.outputs.ok }}

permissions:
  contents: read

jobs:
  test:
    # The process-group kill and reaping behaviour the R19 quota path depends on
    # differs between Darwin and Linux, so both are exercised: Linux here as a
    # required check, Darwin in test-macos as an advisory one.
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The full -race suite stays red on a pre-existing hk 1243 bytes.Buffer
      # race in the r20t5 10ms-timer tests, so the unconfirmed-replay races
      # (#1002/#1034) get their own -race pin on both OSes.
      - run: go test -race -count=3 -run 'T1002|T1034' .
      - run: go test -race -run '^TestQuiet' .
      - run: go test -race -run '^(TestAsyncSpawn|TestSpawn|TestNodeSpawn)' .
      - run: sh -n deploy/alloy/install-linux.sh deploy/alloy/run-alloy.sh

  test-macos:
    # Advisory: hosted macOS runners are often not acquired, so this job never
    # gates ci-ok or mergewake (operator decision 2026-11-05). Same steps as
    # test, plus gitleaks, which only the macOS runner can install.
    name: test (macos-latest, advisory)
    if: ${{ contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The full -race suite stays red on a pre-existing hk 1243 bytes.Buffer
      # race in the r20t5 10ms-timer tests, so the unconfirmed-replay races
      # (#1002/#1034) get their own -race pin on both OSes.
      - run: go test -race -count=3 -run 'T1002|T1034' .
      - run: go test -race -run '^TestQuiet' .
      - run: go test -race -run '^(TestAsyncSpawn|TestSpawn|TestNodeSpawn)' .
      - run: sh -n deploy/alloy/install-linux.sh deploy/alloy/run-alloy.sh
      # gitleaks is installed through Homebrew, which only the macOS runner has.
      - run: brew install gitleaks && gitleaks git --no-banner --config .gitleaks.toml

  postgres:
    # The hub inbox's Postgres backend (docs/hub-postgres.md). Service
    # containers exist only on Linux runners, and hosts never run a database
    # for tests, so this is the only place the Postgres half of the store
    # contract runs. Trust auth keeps a password out of this public file; the
    # service is published on 55432, not the default port.
    if: ${{ contains(fromJSON('["all","postgres"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: panewire
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: store contract, must-ack and migrate-sqlite on Postgres
        env:
          PANEWIRE_TEST_HUB_DATABASE_URL: postgres://postgres@localhost:55432/panewire?sslmode=disable
        shell: bash
        # A skip here would mean the Postgres half silently did not run.
        run: |
          set -o pipefail
          go test -race -count=2 -v -run 'LaneInboxStore|MustAck|IdleWakeKeepsRead|HubServerOpensPostgresInbox|HubMigrateSQLite|HubDatabaseURL' . 2>&1 | tee "$RUNNER_TEMP/postgres-test.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-test.log"; then
            echo "a Postgres test skipped"; exit 1
          fi

  ci-ok:
    # Aggregate gate check: PR CI reports a check run named ci-ok. On
    # dispatches, a partial suite must not mint an exact 'ci-ok' check run.
    name: ${{ (inputs.suite || 'all') == 'all' && 'ci-ok' || format('ci-ok ({0})', inputs.suite) }}
    runs-on: ubuntu-latest
    needs: [test, postgres, auto-tag-test]
    if: always()
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Check required jobs
        id: gate
        env:
          AUTO_TAG_RESULT: ${{ needs.auto-tag-test.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SUITE: ${{ inputs.suite || 'all' }}
        # A job the suite selects must succeed. A job it does not select
        # reports skipped, which passes (ci_workflow_test.go).
        run: |
          [ "$AUTO_TAG_RESULT" = success ] || { echo "auto-tag regression failed"; exit 1; }
          require() {
            selected=$1 name=$2 result=$3
            if [ "$selected" = yes ] && [ "$result" != success ]; then
              echo "$name job did not succeed: $result"; exit 1
            fi
            if [ "$selected" = no ] && [ "$result" != skipped ]; then
              echo "$name job ran outside its suite and reported $result"; exit 1
            fi
          }
          case "$SUITE" in
            all|test|postgres) ;;
            *) echo "unknown suite: $SUITE"; exit 1 ;;
          esac
          case "$SUITE" in all|test) test=yes ;; *) test=no ;; esac
          case "$SUITE" in all|postgres) postgres=yes ;; *) postgres=no ;; esac
          require "$test" test "$TEST_RESULT"
          require "$postgres" postgres "$POSTGRES_RESULT"
          echo "ok=true" >> "${GITHUB_OUTPUT:-/dev/null}"

  auto-tag-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
