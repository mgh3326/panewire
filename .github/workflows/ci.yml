name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact ref (sha) to check out; empty means the event default
        required: false
        default: ''
        type: string
      suite:
        description: Which suites to run (all, test, postgres)
        required: false
        default: all
        type: string
    outputs:
      ok:
        # 'true' when the ci-ok gate passed. ci-any-ref posts its status from
        # this, not from the whole run.
        value: ${{ jobs.ci-ok.outputs.ok }}

concurrency:
  # A new push to a pull request cancels that PR's older run; a new push to
  # main cancels the older main run (one group per ref: policy/fleet-ci-main-cancel);
  # dispatch runs keep their own groups.
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}', github.run_id) || github.event_name == 'push' && format('ci-push-{0}', github.ref) || github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vet:
    # Pull request only: gofmt, go vet, the build and the tests of every
    # package but the root run here, beside the root-package shards below.
    name: vet
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go-cached
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # The shards below run the root package; this runs the rest of ./...
      - name: go test, packages other than the root
        run: go list ./... | grep -v -x "$(go list -m)" | xargs go test

  shard:
    # The root package's tests, split across runners by
    # scripts/ci-test-shard.sh. The shards together run every test in
    # `go test -list .` (ci_workflow_test.go checks the matrix covers all of
    # them), so the pull request path runs the same tests as `go test ./...`.
    name: shard (${{ matrix.shard }})
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/3', '1/3', '2/3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go-cached
      - run: scripts/ci-test-shard.sh ${{ matrix.shard }}

  test:
    # The required check, `test (ubuntu-latest)` (.mergewake/policy.yaml). It
    # keeps that name and fails when the vet job or any shard fails. The
    # process-group kill and reaping behaviour the R19 quota path depends on
    # differs between Darwin and Linux, so both are exercised: Linux here as a
    # required check, Darwin in deploy.yml's macos job (the deploy stage).
    #
    # A needed job that was only cancelled (a hosted runner not acquired) is
    # not a red verdict, so this job is then skipped, as ci-ok is (hk 2924).
    # Any failure still runs it, and it fails.
    if: ${{ always() && github.event_name == 'pull_request' && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
    needs: [vet, shard, postgres]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check vet and shards
        env:
          VET_RESULT: ${{ needs.vet.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          [ "$VET_RESULT" = success ] || { echo "vet job did not succeed: $VET_RESULT"; exit 1; }
          [ "$SHARD_RESULT" = success ] || { echo "a test shard did not succeed: $SHARD_RESULT"; exit 1; }
          # postgres runs only when the PR touches the inbox store.
          case "$POSTGRES_RESULT" in success|skipped) ;; *) echo "postgres job did not succeed: $POSTGRES_RESULT"; exit 1 ;; esac

  post-test:
    # The main stage's basic check set. Race, macOS and the release build live
    # in deploy.yml (operator decision 2026-11-07,
    # hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2 §1), so a main push
    # stays under ten minutes. The process-group kill and reaping behaviour
    # the R19 quota path depends on differs between Darwin and Linux: Linux
    # here, Darwin in deploy.yml's macos job.
    if: ${{ github.event_name != 'pull_request' && contains(fromJSON('["all","test"]'), inputs.suite || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PANEWIRE_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go-cached
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: sh -n deploy/alloy/install-linux.sh deploy/alloy/run-alloy.sh

  store-paths:
    # Pull request only: does this change touch the hub inbox store? The
    # production hub keeps its inbox in Postgres, so such a PR also runs the
    # postgres job below before merge (operator decision 2026-11-06);
    # every other PR stays light.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      store: ${{ steps.paths.outputs.store }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(lane_inbox|inbox_|hub_inbox|hub_postgres|hub_unconfirmed|hub_spawn_task_store|hub_store|store)[^/]*\.go$|^hub\.go$|^hub_postgres_migrations/'; then
            echo "store=true" >> "$GITHUB_OUTPUT"
          else
            echo "store=false" >> "$GITHUB_OUTPUT"
          fi

  postgres:
    # The hub inbox's Postgres backend (docs/hub-postgres.md). Service
    # containers exist only on Linux runners, and hosts never run a database
    # for tests, so this is the only place the Postgres half of the store
    # contract runs. Trust auth keeps a password out of this public file; the
    # service is published on 55432, not the default port.
    # Post-merge and dispatch runs, and a pull request whose store-paths
    # job found an inbox-store change.
    needs: [store-paths]
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' && contains(fromJSON('["all","postgres"]'), inputs.suite || 'all')) || (github.event_name == 'pull_request' && needs.store-paths.outputs.store == 'true')) }}
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PANEWIRE_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: panewire
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-go-cached
      - name: store contract and must-ack on Postgres
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PANEWIRE_TEST_HUB_DATABASE_URL: postgres://postgres@localhost:55432/panewire?sslmode=disable
        shell: bash
        # A skip here would mean the Postgres half silently did not run.
        run: |
          set -o pipefail
          go test -race -count=2 -v -run 'LaneInboxStore|MustAck|IdleWakeKeepsRead|HubServerOpensPostgresInbox|HubDatabaseURL' . 2>&1 | tee "$RUNNER_TEMP/postgres-test.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-test.log"; then
            echo "a Postgres test skipped"; exit 1
          fi
      # Main stage (r2 §1): the full Postgres integration test, without -race,
      # for every store test, and never narrowed by changed paths.
      - name: store contract on Postgres (main stage, no race)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PANEWIRE_TEST_HUB_DATABASE_URL: postgres://postgres@localhost:55432/panewire?sslmode=disable
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v -run 'LaneInboxStore|MustAck|IdleWakeKeepsRead' . 2>&1 | tee "$RUNNER_TEMP/postgres-store.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-store.log"; then
            echo "a Postgres test skipped"; exit 1
          fi
      - name: migration and startup check on Postgres (main stage)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PANEWIRE_TEST_HUB_DATABASE_URL: postgres://postgres@localhost:55432/panewire?sslmode=disable
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v -run 'HubServerOpensPostgresInbox|HubDatabaseURL' . 2>&1 | tee "$RUNNER_TEMP/postgres-migrate.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-migrate.log"; then
            echo "a Postgres test skipped"; exit 1
          fi

  ci-ok:
    # Aggregate gate check: PR CI reports a check run named ci-ok. On
    # dispatches, a partial suite must not mint an exact 'ci-ok' check run.
    name: ${{ (inputs.suite || 'all') == 'all' && 'ci-ok' || format('ci-ok ({0})', inputs.suite) }}
    runs-on: ubuntu-latest
    needs: [test, post-test, postgres, auto-tag-test]
    # A needed job that was only cancelled (a hosted runner not acquired) is
    # not a red verdict: ci-ok is then skipped, which mergewake reads as
    # unknown and holds on, instead of failing and reading as Red. Any
    # failure still runs the gate, which fails (hk 2924).
    if: ${{ always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Check required jobs
        id: gate
        env:
          AUTO_TAG_RESULT: ${{ needs.auto-tag-test.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POST_TEST_RESULT: ${{ needs.post-test.result }}
          EVENT: ${{ github.event_name }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SUITE: ${{ inputs.suite || 'all' }}
        # A job the suite selects must succeed. A job it does not select
        # reports skipped, which passes (ci_workflow_test.go).
        run: |
          [ "$AUTO_TAG_RESULT" = success ] || { echo "auto-tag regression failed"; exit 1; }
          require() {
            selected=$1 name=$2 result=$3
            if [ "$selected" = yes ] && [ "$result" != success ]; then
              echo "$name job did not succeed: $result"; exit 1
            fi
            if [ "$selected" = no ] && [ "$result" != skipped ]; then
              echo "$name job ran outside its suite and reported $result"; exit 1
            fi
          }
          case "$SUITE" in
            all|test|postgres) ;;
            *) echo "unknown suite: $SUITE"; exit 1 ;;
          esac
          case "$SUITE" in all|test) test=yes ;; *) test=no ;; esac
          case "$SUITE" in all|postgres) postgres=yes ;; *) postgres=no ;; esac
          if [ "$EVENT" = pull_request ]; then
            require yes test "$TEST_RESULT"
            require no post-test "$POST_TEST_RESULT"
            # A PR runs postgres only for an inbox-store change.
            case "$POSTGRES_RESULT" in success|skipped) ;; *) echo "postgres job did not succeed: $POSTGRES_RESULT"; exit 1 ;; esac
            postgres=checked
          else
            require no test "$TEST_RESULT"
            require "$test" post-test "$POST_TEST_RESULT"
          fi
          [ "$postgres" = checked ] || require "$postgres" postgres "$POSTGRES_RESULT"
          echo "ok=true" >> "${GITHUB_OUTPUT:-/dev/null}"

  auto-tag-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
