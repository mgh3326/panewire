name: CI (any ref)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact ref to test - a 40-hex sha or a branch name (no merge with main)
        required: true
        type: string
      suite:
        description: Which suites to run
        required: false
        type: choice
        default: all
        options:
          - all
          - test
          - postgres
          - deploy

permissions:
  contents: read
  statuses: write

jobs:
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    # No concurrency group here: keying it on inputs.ref alone lets a
    # same-ref different-suite dispatch cancel a resolve mid-flight and the
    # run dies silently (hk 2199 / comment 8104, one job earlier).
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          SHA="$(scripts/resolve-ci-ref "$INPUT_REF" "$GITHUB_REPOSITORY")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: ci at target ref
    needs: resolve
    # Suite deploy is the deploy stage: it calls deploy.yml below, and ci.yml
    # does not know that suite name.
    if: ${{ inputs.suite != 'deploy' }}
    # Concurrency is keyed on the RESOLVED sha plus the suite (hk 2199): a
    # dispatch by branch name and one by its sha share a key, and a dispatch on
    # the same sha cancels only the same suite, never a run of a different
    # suite on that sha. The ci and status jobs use DIFFERENT namespaces so a
    # superseded run's status job can never cancel the newer run's ci job.
    concurrency:
      group: ci-any-ref-ci-${{ needs.resolve.outputs.sha }}-${{ inputs.suite }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      suite: ${{ inputs.suite }}

  deploy:
    name: deploy at target ref
    needs: resolve
    # Any ref can run the deploy stage (r2 §4-2/§4-4). deploy.yml applies its
    # own "never cancelled, one per repo" concurrency rule, and posts the
    # deploy-ok commit status with the candidate evidence.
    if: ${{ inputs.suite == 'deploy' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  status:
    name: post ci-ok status
    # A completed dispatch posts a COMMIT STATUS named ci-ok on the target sha;
    # PR CI reports a CHECK RUN named ci-ok. For fixed-base drafts the gate reads
    # the commit status on the exact head, which only exists for suite=all —
    # partial suites post ci-ok-<suite> and name their check ci-ok (<suite>).
    # Suite deploy posts deploy-ok itself from deploy.yml, so it has no ci-ok
    # status to add.
    if: always() && needs.resolve.result == 'success' && inputs.suite != 'deploy'
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-any-ref-status-${{ needs.resolve.outputs.sha }}-${{ inputs.suite }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      # The ci-ok gate's verdict, not the whole run.
      RESULT: ${{ needs.ci.outputs.ok == 'true' && 'success' || needs.ci.result == 'success' && 'failure' || needs.ci.result }}
      SUITE: ${{ inputs.suite }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post commit status on target sha
        run: |
          case "$RESULT" in
            success)   STATE=success ;;
            cancelled) STATE=error ;;
            *)         STATE=failure ;;
          esac
          # Only a full run earns the gate context; partial suites get ci-ok-<suite>.
          if [[ "$SUITE" == all ]]; then CONTEXT=ci-ok; else CONTEXT="ci-ok-$SUITE"; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="exact-head CI ($SUITE): $RESULT"
