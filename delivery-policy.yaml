# Safety tags interrupt. The operator-desk override defers routine READY.
# Otherwise explicit class wins, then the first lane/global rule.
default: interrupt
# Design-session lanes (panewire-design, handoffkeep-design, ...) hear
# decisions and failures only: no idle-wake, no inbox summary, no unread
# digest. Exact names and shell-style globs (path.Match). operator-desk is
# never a design lane. Design lanes and desk lanes (relay.desk_lanes, default
# operator-desk and *-operator-desk) are inbox-only with a coalesced one-line
# wake (relay.inbox_wake_window, default 5m); see docs/quiet-delivery.md.
relay:
  design_lanes: ["*-design"]
# Completed inbox history; unread items and the one-day replay window are protected.
retention:
  days: 14
  per_lane: 2000
deadlines:
  inbox: 30m
  interrupt: 0s
# Off by default; e.g. 2s combines interrupts for each receiving lane.
digest_window: 0s
# Sender-declared notification types (--type), resolved ahead of the regex
# rules below. These entries mirror the built-in defaults; a policy file may
# override individual keys globally or per lane.
types:
  decision: interrupt
  order: interrupt
  ready: interrupt
  blocked: interrupt
  findings: interrupt
  report: inbox
  ack: inbox
  info: inbox
# Per-CLI inbox capability for the receiving pane's agent (the harness the
# node reports for the lane's pane). Receivers without a supported entry —
# unknown or unreported harnesses included — get every event immediately with
# no inbox deferral; supported receivers use the type/owner/idle timing rules.
# This entry mirrors the built-in default; flipping one CLI is a one-line edit.
agents:
  claude: supported
rules:
  # Whole-word, case-insensitive must-act tags. READYING and ESCAPE do not match.
  - tags: [BLOCKER, READY, ESC, BOUNCE, URGENT, needs_decision]
    class: interrupt
  - match: '(?i)\bdecision[ _-]?(request|required|needed)\b|\baction[ _-]?(required|needed|now)\b|\bneeds? (an? )?(action|decision)\b|결정.*(요청|필요)|차단'
    class: interrupt
  - match: '[?？]|(?i)direct question|질문'
    class: interrupt
  - kind: job.escalate
    class: interrupt
  - kind: job.lost
    class: interrupt
  - kind: job.revoked
    class: interrupt
  - replay: true
    class: inbox
  - kind: job.completed
    class: inbox
  - kind: job.joined
    class: inbox
  # Informational signals are whole-word too, so a stray "info" inside a
  # must-act message can no longer pull it into the inbox.
  - match: '(?i)\bdone\s*\||\bFYI\b|\back\b|\backnowledged\b|\binstall[ _-]?(done|complete)\b|\binstalled\b|\bmerged\b.*\b(please[ _-])?install\b|설치.*완료|확인했습니다'
    class: inbox
  - match: '(?i)\binfo([ _-]alert)?\b|\bquota\b|\breplayed after hub restart\b|"kind"\s*:\s*"idle-wake"|알림'
    class: inbox
# Override any field per receiving lane. Rules fall through to global rules.
# Opt in per lane with hold_while_working: {max_hold: 10m}.
# Handoff thresholds default to handoff_bytes: 1500, handoff_items: 3.
lanes:
  operator-desk:
    # The Dagu digest job owns the 30-minute document. The hub only adds a
    # bounded reference to the latest document when a real interrupt lands.
    inbox_summary:
      digest_prefix: inbox/operator-desk/digest/
      max_chars: 300
    types:
      ready: inbox
      merged: inbox
      blocked: inbox
      findings: inbox
      idle-wake: inbox
      progress: inbox
      report: inbox
      decision: interrupt
      order: interrupt
      deploy-approval: interrupt
      watch-hold: interrupt
      culprit-hold: interrupt
      automation-failed: interrupt
    rules:
      - tags: [READY]
        class: inbox
      - kind: job.completed
        class: inbox
      - kind: job.joined
        class: inbox
