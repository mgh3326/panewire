# Must-act tags always interrupt, ahead of explicit class and all inbox rules.
# Otherwise explicit class wins, then the first lane/global rule.
default: interrupt
deadlines:
  inbox: 30m
  interrupt: 0s
# Off by default; e.g. 2s combines interrupts for each receiving lane.
digest_window: 0s
# Sender-declared notification types (--type), resolved ahead of the regex
# rules below. These entries mirror the built-in defaults; a policy file may
# override individual keys globally or per lane.
types:
  decision: interrupt
  order: interrupt
  ready: interrupt
  report: inbox
  ack: inbox
  info: inbox
# Per-CLI inbox capability for the receiving pane's agent (the harness the
# node reports for the lane's pane). Receivers without a supported entry —
# unknown or unreported harnesses included — get every event immediately with
# no inbox deferral; supported receivers use the type/owner/idle timing rules.
# This entry mirrors the built-in default; flipping one CLI is a one-line edit.
agents:
  claude: supported
rules:
  # Whole-word, case-insensitive must-act tags. READYING and ESCAPE do not match.
  - tags: [BLOCKER, READY, ESC, BOUNCE, URGENT, needs_decision]
    class: interrupt
  - match: '(?i)\bdecision[ _-]?(request|required|needed)\b|\baction[ _-]?(required|needed|now)\b|\bneeds? (an? )?(action|decision)\b|결정.*(요청|필요)|차단'
    class: interrupt
  - match: '[?？]|(?i)direct question|질문'
    class: interrupt
  - kind: job.escalate
    class: interrupt
  - kind: job.lost
    class: interrupt
  - kind: job.revoked
    class: interrupt
  - replay: true
    class: inbox
  - kind: job.completed
    class: inbox
  - kind: job.joined
    class: inbox
  # Informational signals are whole-word too, so a stray "info" inside a
  # must-act message can no longer pull it into the inbox.
  - match: '(?i)\bdone\s*\||\bFYI\b|\back\b|\backnowledged\b|\binstall[ _-]?(done|complete)\b|\binstalled\b|\bmerged\b.*\b(please[ _-])?install\b|설치.*완료|확인했습니다'
    class: inbox
  - match: '(?i)\binfo([ _-]alert)?\b|\bquota\b|\breplayed after hub restart\b|"kind"\s*:\s*"idle-wake"|알림'
    class: inbox
# Override any field per receiving lane. Rules fall through to global rules.
lanes: {}
