<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panewire chat</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17212b;background:#f5f7fa}body{max-width:1200px;margin:auto;padding:1rem}h1{font-size:1.5rem;margin:.2rem 0}h2{font-size:1rem;margin:.3rem 0 1rem}.muted{color:#607080;font-size:.85rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:1rem}.panel{background:#fff;border:1px solid #d6dce3;border-radius:.7rem;padding:1rem}.timeline{height:min(65vh,750px);overflow:auto;display:flex;flex-direction:column;gap:.7rem}.entry{padding:.75rem;border:1px solid #dce2e9;border-radius:.6rem;max-width:85%;background:#fff}.entry.operator{align-self:flex-end;background:#eaf4ff}.entry.desk,.entry.question{align-self:flex-start}.entry.failed{border-color:#d84040}.body,.quote{white-space:pre-wrap;overflow-wrap:anywhere}.body{margin:.45rem 0}.meta{color:#607080;font-size:.78rem}.quote{border-left:3px solid #80a5c7;padding:.35rem .6rem;margin:.45rem 0;background:#f4f8fc;font-size:.9rem}.qid{font-weight:600}.question-card{border:1px solid #d6dce3;border-radius:.5rem;padding:.55rem;margin:.4rem 0;background:#fcfcf7}.question-card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:.3rem 0}.pending{display:flex;flex-direction:column;gap:.6rem;max-height:65vh;overflow:auto}.pending .question-card{margin:0}.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}.chip{border:1px solid #87a8c7;border-radius:1rem;background:#eaf4ff;padding:.25rem .6rem;cursor:pointer}.chip.selected{background:#1b6ca8;color:white}.chip:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #1b6ca8}button{cursor:pointer}button.action{margin:.25rem .3rem .1rem 0;padding:.3rem .6rem}textarea{width:100%;box-sizing:border-box;min-height:5rem;font:inherit;padding:.55rem;border:1px solid #b9c4d0;border-radius:.4rem}.composer{margin-top:1rem}.error{color:#a32525}.empty{color:#607080;font-style:italic}@media(max-width:750px){.layout{grid-template-columns:1fr}.timeline{height:55vh}.pending{max-height:28vh}.entry{max-width:95%}}@media(prefers-color-scheme:dark){:root{color:#e3e9ef;background:#10161d}.panel,.entry{background:#1b2530;border-color:#3c4a58}.entry.operator,.chip{background:#1d3a55}.quote{background:#223240}.question-card{background:#252c2b;border-color:#495350}textarea{background:#151d26;color:#e3e9ef;border-color:#52606e}.muted,.meta,.empty{color:#abb8c6}}
</style>
</head>
<body>
<header><h1>창구 대화</h1><div class="muted" id="status">불러오는 중…</div></header>
<div class="layout">
<main class="panel"><h2>대화</h2><div id="timeline" class="timeline" aria-live="polite"></div></main>
<aside class="panel"><h2>대기 중인 질문</h2><div id="pending" class="pending"></div></aside>
</div>
<section class="panel composer"><h2>답변</h2><div class="muted">대화의 창구로 전달됩니다. 질문을 여러 개 선택할 수 있습니다.</div><div id="chips" class="chips"></div><textarea id="body" placeholder="창구에 보낼 답변"></textarea><div><button id="send" class="action">보내기</button><span class="muted">긴 답변은 저장소의 메시지 ID로 전달됩니다.</span></div></section>
<script>
const $=s=>document.querySelector(s),draftKey="panewire-chat-origin-event",bodyKey="panewire-chat-draft",selectionKey="panewire-chat-selection",conversation="operator-desk";
let savedSelection=[];try{savedSelection=JSON.parse(localStorage.getItem(selectionKey)||"[]")}catch{}
const selected=new Set(Array.isArray(savedSelection)?savedSelection:[]);
let questions=[],messages=[],sending=false;
const text=v=>String(v??""),when=v=>v?new Date(v).toLocaleString():"—";
function el(tag,cls,value){const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=text(value);return node}
function action(label,fn){const b=el("button","action",label);b.onclick=fn;return b}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||"HTTP "+r.status);return data}
function status(s,error){$("#status").textContent=s;$("#status").className=error?"error":"muted"}
function toggle(id){localStorage.removeItem(draftKey);if(selected.has(id))selected.delete(id);else selected.add(id);localStorage.setItem(selectionKey,JSON.stringify([...selected]));renderChips();renderPending()}
function renderChips(){const root=$("#chips");root.replaceChildren();for(const id of selected){const q=questions.find(x=>x.id===id);const chip=action(id+" ×",()=>toggle(id));chip.className="chip selected";chip.title=q?.body||"";root.append(chip)}if(!selected.size)root.append(el("span","muted","선택한 질문 없음"))}
async function transition(id,to){try{await post("/chat/questions/"+encodeURIComponent(id)+"/transition",{to});await load()}catch(e){status("질문 처리 실패: "+e.message,true)}}
function questionCard(x,side){const card=el("div","question-card");card.append(el("div","qid",x.id+" · "+(x.state==="pending"?"대기":x.state==="resolved"?"처리됨":x.state==="withdrawn"?"철회됨":"기록")));card.append(el("p","",x.body));card.append(el("div","meta",when(x.created_at)));if(x.state==="pending"){card.append(action(selected.has(x.id)?"선택 해제":"답변 선택",()=>toggle(x.id)));card.append(action("처리",()=>transition(x.id,"resolved")));card.append(action("철회",()=>transition(x.id,"withdrawn")))}return card}
function renderPending(){const root=$("#pending");root.replaceChildren();const pending=questions.filter(x=>x.state==="pending");if(!pending.length){root.append(el("div","empty","대기 중인 질문 없음"));return}for(const x of pending)root.append(questionCard(x,true))}
async function retry(id){try{await post("/chat/messages/"+id+"/retry",{});await load()}catch(e){status("재전송 실패: "+e.message,true)}}
async function cancel(id){if(!confirm("이 메시지를 취소할까요?"))return;try{await post("/chat/messages/"+id+"/cancel",{});await load()}catch(e){status("취소 실패: "+e.message,true)}}
function messageCard(m){const card=el("article","entry "+(m.author==="operator"?"operator":"desk")+(m.relay_state==="failed"?" failed":""));const state=m.author==="operator"?" · "+(m.cancelled?"취소됨":m.relay_state==="stored"?"전송 중":m.relay_state==="failed"?"전송 실패":"전달됨"):"";card.append(el("div","meta",(m.author==="operator"?"운영자":"창구")+" · "+when(m.created_at)+" · #"+m.id+state+(m.origin_timestamp&&!String(m.origin_timestamp).startsWith("0001-")&&m.origin_timestamp!==m.created_at?" · 원시각 "+when(m.origin_timestamp):"")));card.append(el("div","body",m.body));for(const rel of m.question_relations||[]){if(rel.relation_kind==="reply")card.append(el("div","quote",rel.question_id+" · "+rel.question_text));if(rel.relation_kind==="posted"){const current=questions.find(x=>x.id===rel.question_id);const q={id:rel.question_id,body:rel.question_text,state:current?.state||"",created_at:current?.created_at||m.created_at};card.append(questionCard(q,false))}if(rel.relation_kind==="resolve")card.append(el("div","meta",rel.question_id+" 처리됨"))}if(m.author==="operator"&&m.relay_state==="failed")card.append(action("재전송",()=>retry(m.id)));if(m.author==="operator"&&m.relay_state==="stored")card.append(action("취소",()=>cancel(m.id)));return card}
function renderTimeline(){const root=$("#timeline"),nearBottom=root.scrollHeight-root.scrollTop-root.clientHeight<70,oldTop=root.scrollTop;root.replaceChildren();const posted=new Set();for(const m of messages)for(const rel of m.question_relations||[])if(rel.relation_kind==="posted")posted.add(rel.question_id);const items=messages.map(m=>({at:m.created_at,id:m.id,kind:"message",value:m}));for(const x of questions)if(!posted.has(x.id))items.push({at:x.created_at,id:x.id,kind:"question",value:x});items.sort((a,b)=>new Date(a.at)-new Date(b.at)||(a.kind==="message"&&b.kind==="message"?a.id-b.id:String(a.id).localeCompare(String(b.id))));if(!items.length)root.append(el("div","empty","대화 기록 없음"));for(const item of items){if(item.kind==="message")root.append(messageCard(item.value));else{const wrap=el("article","entry question");wrap.append(questionCard(item.value,false));root.append(wrap)}}root.scrollTop=nearBottom?root.scrollHeight:oldTop}
async function load(){try{const r=await fetch("/chat/data",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();questions=d.questions||[];messages=d.messages||[];renderChips();renderPending();renderTimeline();status("5초마다 갱신 · "+new Date().toLocaleTimeString(),false)}catch(e){status("채팅 저장소 사용 불가 ("+e.message+")",true)}}
function eventID(){let id=localStorage.getItem(draftKey);if(!id){id=crypto.randomUUID();localStorage.setItem(draftKey,id)}return id}
async function send(){if(sending)return;const body=$("#body").value,ids=[...selected];if(!body.trim()){status("답변을 입력하세요",true);return}sending=true;$("#send").disabled=true;try{await post("/chat/messages",{conversation_id:conversation,body,question_ids:ids,origin_event_id:eventID()});localStorage.removeItem(draftKey);localStorage.removeItem(bodyKey);localStorage.removeItem(selectionKey);$("#body").value="";selected.clear();await load()}catch(e){status("전송 실패: "+e.message,true)}finally{sending=false;$("#send").disabled=false}}
$("#body").value=localStorage.getItem(bodyKey)||"";$("#body").addEventListener("input",()=>{localStorage.removeItem(draftKey);localStorage.setItem(bodyKey,$("#body").value)});$("#send").onclick=send;load();setInterval(load,5000);
</script>
</body>
</html>
